<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <base href="/" />
    <title>Admin — จัดการคำอวยพร</title>
    <meta name="robots" content="noindex" />
    <style>
      body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; padding: 24px; background: #f5f5f5; color: #222; line-height: 1.6; }
      main { max-width: 720px; margin: 0 auto; }
      h1 { font-size: 20px; letter-spacing: 0.1em; }
      label { display: block; margin-bottom: 4px; font-size: 14px; }
      input { width: 100%; padding: 10px; font-size: 16px; margin-bottom: 12px; border: 1px solid #bbb; border-radius: 4px; }
      button { padding: 10px 16px; font-size: 15px; cursor: pointer; border: 1px solid #888; background: #fff; border-radius: 4px; min-height: 44px; }
      button.danger { border-color: #b33; color: #b33; }
      .card { background: #fff; border: 1px solid #ddd; padding: 14px; margin-bottom: 12px; border-radius: 4px; }
      .meta { font-size: 13px; color: #666; }
      .msg { font-size: 14px; min-height: 20px; }
      .msg.err { color: #b33; }
      pre { white-space: pre-wrap; word-break: break-word; margin: 6px 0; font-family: inherit; }
      hr { border: 0; border-top: 1px solid #ddd; margin: 16px 0; }
    </style>
  </head>
  <body>
    <main>
      <h1>ADMIN</h1>

      <section id="login-view" hidden>
        <form id="login-form">
          <label for="email">อีเมล</label>
          <input id="email" type="email" autocomplete="username" required />
          <label for="password">รหัสผ่าน</label>
          <input id="password" type="password" autocomplete="current-password" required />
          <button type="submit">Login</button>
          <p class="msg" id="login-msg" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section id="admin-view" hidden>
        <p>
          <span id="who" class="meta"></span>
          <button type="button" id="logout">Logout</button>
        </p>
        <hr />
        <h2 style="font-size: 17px">คำอวยพร</h2>
        <p class="msg" id="admin-msg" role="status" aria-live="polite"></p>
        <div id="list"></div>
      </section>
    </main>

    <script src="config.js"></script>
    <script type="module" src="admin.js"></script>
  </body>
</html>
